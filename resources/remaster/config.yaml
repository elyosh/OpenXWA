# OpenXWA shipped default configuration.
# This file is mandatory; the user config.yaml may override documented user
# settings.
input:
  mouse_flight: false
  mouse_mode: 'position'
  mouse_sensitivity: 5
  mouse_invert_y: true
  rumble_enabled: true
  rumble_strength: 6
  # Saved controller models, one complete profile each. New gamepads get
  # gamepad_defaults; joysticks start with nothing bound.
  controllers: []
  gamepad_defaults:
    axes:
      yaw: {source: leftx, invert: false, deadzone: 0.08}
      pitch: {source: lefty, invert: false, deadzone: 0.08}
      roll: {source: rightx, invert: false, deadzone: 0.08}
      throttle: {source: none, invert: false}
    buttons:
      fire_weapon: [south, {axis: righttrigger, direction: positive, threshold: 0.5}]
      target_roll_modifier: [east, {axis: lefttrigger, direction: positive, threshold: 0.5}]
      target_nearest_fighter: [west]
      toggle_padlock: [north]
      target_my_attackers: [leftshoulder]
      target_incoming_warhead: [rightshoulder]
      throttle_one_third: [back]
      throttle_full: [start]
      look_up: [dpadup]
      look_right: [dpadright]
      look_down: [dpaddown]
      look_left: [dpadleft]
  # Every action, with its keys. Escape always opens the options and can't
  # be listed; options_menu can get other keys.
  keyboard:
    fire_weapon:
      - {key: "2", modifiers: [alt]}
    target_roll_modifier: []
    cycle_weapon:
      - {key: "W"}
    cycle_firing_mode:
      - {key: "X"}
    laser_convergence_or_zoom_map_target:
      - {key: "Z"}
    toggle_beam:
      - {key: "B"}
    fire_countermeasure_or_center_map_target:
      - {key: "C"}
    toggle_auto_gunner:
      - {key: "F"}
    cycle_beam_recharge_rate:
      - {key: "F8"}
    cycle_laser_recharge_rate:
      - {key: "F9"}
    cycle_shield_recharge_rate:
      - {key: "F10"}
    cycle_shield_mode:
      - {key: "S"}
    xfer_shields_to_lasers:
      - {key: ";"}
      - {key: "F9", modifiers: [shift]}
    xfer_lasers_to_shields:
      - {key: "'"}
      - {key: "F10", modifiers: [shift]}
    xfer_all_lasers_to_shields:
      - {key: "'", modifiers: [shift]}
    target_in_sights:
      - {key: "1", modifiers: [alt]}
    target_next:
      - {key: "T"}
    target_prev:
      - {key: "Y"}
    target_nearest_fighter:
      - {key: "R"}
    target_attacker_of_target:
      - {key: "A"}
    target_my_attackers:
      - {key: "E"}
    target_newest:
      - {key: "U"}
    target_objective:
      - {key: "O"}
    target_nearest_player:
      - {key: "P"}
    target_next_player_craft:
      - {key: "P", modifiers: [ctrl]}
    target_incoming_warhead:
      - {key: "I"}
    target_next_buoy:
      - {key: "N"}
    target_next_friendly:
      - {key: "F1"}
    target_prev_friendly:
      - {key: "F1", modifiers: [shift]}
    target_next_neutral:
      - {key: "F2"}
    target_prev_neutral:
      - {key: "F2", modifiers: [shift]}
    target_next_enemy:
      - {key: "F3"}
    target_prev_enemy:
      - {key: "F4"}
      - {key: "F3", modifiers: [shift]}
    target_component_next:
      - {key: ","}
    target_component_prev:
      - {key: ",", modifiers: [shift]}
    target_clear:
      - {key: "C", modifiers: [alt]}
    target_preset_recall_1:
