models:
  smooth_angle_degrees: 90
  # true: original OPT models for simulation and rendering.
  # false: flight/models/<key>.glb replacements in the mod folder, where present, for both.
  force_opt: false
  # Classic emission (the OPTs' lit texels, projectiles, engine glows,
  # explosions, glow marks, cockpit screens) is shown at the radiance of a
  # backdrop texel: classic_lighting.image_radiance. These strengths
  # multiply it.
  opt_emissive_strength: 3.0
  opt_projectile_emissive_strength: 20.0
  engine_emissive_strength: 10.0
  # Draws the back faces of one-sided meshes in black, to hide the gaps
  # between their faces.
  backface_fill: false
effects:
  explosion_genus_emissive_strength: 10.0
  glow_mark_emissive_strength: 20.0
  # The same, for the hit marks on the cockpit model. 0 hides them.
  cockpit_glow_mark_emissive_strength: 1.0
  # The same, for the flashes on the cockpit model when a hit lands on the
  # shields or a warhead hits the craft. The game sizes these flashes to the
  # whole craft, so they cover the whole cockpit. 0 hides them.
  cockpit_hit_flash_emissive_strength: 0.2
dynamic_cockpit:
  # Cockpit displays that show the HUD, from the screens of the cockpit
  # models.
  enabled: true
  # Keep the whole 2D HUD on screen; transparent displays
  # without always_visible are hidden and the throttle bar is not drawn.
  classic_hud: false
  # Hologram displays visible; Ctrl+H toggles them in flight.
  holograms: true
  # Emissive multipliers of the display content and of holograms.
  display_emissive_strength: 1.5
  hologram_emissive_strength: 1.5
assets:
  prefer_original_2d: false
  # Play the original movies even when the mod folder has replacements
  # (frontend/movies/<name>.mp4).
  prefer_original_movies: false
presentation:
  # 1 renders at the display refresh rate; 2 renders at half refresh.
  vsync_divisor: 1
  # Frames the GPU may work on at once, 1 or 2. With 2, the next frame
  # starts while the GPU still draws the last one, which gives the GPU more
  # of each refresh.
  frames_in_flight: 2
  # Starts each frame later by the time the last frames waited for the
  # display with their GPU work done, so input is read closer to when the
  # frame is shown. Only with vsync_divisor 1.
  latency_pacing: true
  # Required shipped baseline; user config.yaml may override both values.
  msaa_samples: 2
  hdr_output: true
  # The field of view of the player's craft, from its model:
  # cockpit: the view the model gives its pilot eye.
  # wide: the wide view of the craft's model settings, else the cockpit view.
  # off: the stock view.
  cockpit_fov: 'cockpit'
  # With a craft's field of view, a window narrower than this aspect gets a
  # wider view, so that the horizontal field of view stays the one at this
  # aspect. 1.778 is 16:9. 0 turns it off.
  cockpit_fov_min_aspect: 1.778
# The camera lag and tilt, the cockpit sway and the HUD in the exterior view.
# A mod can change these values. The options only offer Enhanced Camera,
# which sets `enabled`.
camera:
  # Off keeps the original game's views.
  enabled: false
  # The exterior camera trails the craft's turns.
  exterior_lag: true
  # The camera turns by this many radians for each radian of lag, 0 to 2...
  exterior_lag_strength: 0.47
  # ...but by no more than this many degrees, 0 to 15.
  exterior_lag_max: 4.05
  # The exterior camera looks at the craft from this many degrees above,
  # -30 to 30.
  exterior_tilt: 10.0
  # The cockpit sways with turns and speed changes.
  cockpit_sway: true
  # The eye moves this many metres for each radian of lag, 0 to 0.5.
  cockpit_sway_strength_m: 0.122
  # The eye moves back this many metres for each MGLT of speed change,
  # 0 to 0.05.
  cockpit_speed_sway_m: 0.0041
  # The eye moves no more than this many metres on each axis, 0 to 0.25.
  cockpit_sway_max_m: 0.061
  # How fast the lag and the sway catch up, in seconds, 0.05 to 2.
  lag_time: 0.32
  # Shows the HUD and the reticle in the exterior view of the player's craft.
  exterior_hud: true
# The camera shake and jolt in hyperspace jumps, in modern graphics
# (hyperspace_camera). A mod can change this value. The Camera Shake option
# sets `enabled`.
camera_shake:
  # Off keeps the camera steady.
  enabled: true
# Shows the target's name, cargo, distance and damage bars next to its box
# in the 3D view. A mod can change these values. The options screen only has
# a Target Readout switch, which sets `enabled`.
target_readout:
  # Off keeps the original game's HUD.
  enabled: false
  # The text size: small, medium or large. They use the flight font's 10, 12
  # and 16 point sizes.
  text_size: medium
  # The space between the last line of text and the top of the box, in
  # points, 0 to 100.
  text_gap: 9
  # Makes the text brighter and more saturated than the CMD's.
  brighten_text: true
  # single draws the whole name in one colour, the colour of the flight
  # group. cmd uses the CMD's colours: one for the craft type and another
  # for the flight group.
  name_colors: single
  # Draws the shield, hull and system bars.
  bars: true
  # vertical puts the shield bar on the left of the box, the hull bar on the
  # right and the system bar under it. horizontal puts all three bars under
  # the box.
  layout: vertical
  # A bar is 70% of the box width, kept between these two lengths. In
  # points, 1 to 1000.
  bar_length_min: 16
  bar_length_max: 140
  # The bar thickness in points, 1 to 50.
  bar_thickness: 7
  # The space between the box and the bars, and between two bars, in points,
  # 0 to 100.
  bar_gap: 4
  # The width of the bar outline in points, 0 to 10.
  bar_frame: 0
  # The colours are linear.
  shield_color: [0.0134, 0.214, 1.0]
  # The colour of the shields above 100%.
  overshield_color: [0.205, 0.933, 1.0]
  hull_color_full: [0.0, 1.0, 0.0]
  hull_color_half: [1.0, 1.0, 0.0]
  hull_color_low: [1.0, 0.0, 0.0]
  system_color: [0.604, 0.214, 1.0]
  # The smallest and largest size of the component box, in points, 0 to
  # 1000. 0 means no limit.
  component_box_min: 20
  component_box_max: 150
  # The component's box shrinks to 70% and jumps back, once a second.
  component_pulse: true
  # Hides the readout where the 3D scene is closer than this many metres,
  # 0 to 1000. 25 hides it behind the cockpit. 0 turns this off.
  hidden_within_m: 25
# The procedural suns and their lens flare. A mod can change these values.
suns:
  # Backdrop suns draw a procedural disc and corona in place of their image.
  procedural_sun: false
  # The sun that casts the shadows draws a procedural lens flare in place of
  # the classic flare images.
  procedural_flare: false
  # The flare's strength, 0 to 10.
  flare_intensity: 3.0
  # The brightness of the sun's disc and rays, as a multiple of a white classic
  # image, like effects.explosion_genus_emissive_strength, 0 to 100.
  brightness: 1.2
  # The light added in the sun's core, as a multiple of the disc's brightness,
  # 0 to 1000. It makes the sun glow through the bloom.
  core_brightness: 1.0
  # The flare's shapes: halos, discs, hexagons and a streak, placed along the
  # line from the sun through the centre of the screen.
  flare_elements:
    - { shape: halo, position: -0.80, stretch: 1, size: 32, color: [0.25, 0, 0] }
    - { shape: halo, position: -0.85, stretch: 1, size: 32, color: [0, 0.23, 0] }
    - { shape: halo, position: -0.90, stretch: 1, size: 32, color: [0, 0, 0.21] }
    - { shape: disc, position: -0.40, stretch: -0.5, size: 0.147, power: 2.4, color: [0.06, 0, 0] }
    - { shape: disc, position: -0.45, stretch: -0.5, size: 0.147, power: 2.4, color: [0, 0.05, 0] }
    - { shape: disc, position: -0.50, stretch: -0.5, size: 0.147, power: 2.4, color: [0, 0, 0.03] }
    - { shape: disc, position: -0.2, stretch: -0.4, size: 0.433, power: 5.5, color: [0.02, 0, 0] }
    - { shape: disc, position: -0.4, stretch: -0.4, size: 0.433, power: 5.5, color: [0, 0.02, 0] }
    - { shape: disc, position: -0.6, stretch: -0.4, size: 0.433, power: 5.5, color: [0, 0, 0.02] }
    - { shape: disc, position: 0.300, stretch: -0.5, size: 0.056, power: 1.6, color: [0.06, 0, 0] }
    - { shape: disc, position: 0.325, stretch: -0.5, size: 0.056, power: 1.6, color: [0, 0.03, 0] }
    - { shape: disc, position: 0.350, stretch: -0.5, size: 0.056, power: 1.6, color: [0, 0, 0.05] }
    - { shape: disc, position: -0.70, stretch: -0.2, size: 0.1, power: 2, color: [0.04, 0, 0] }
    - { shape: disc, position: -0.75, stretch: -0.2, size: 0.1, power: 2, color: [0, 0.05, 0] }
    - { shape: disc, position: -0.80, stretch: -0.2, size: 0.1, power: 2, color: [0, 0, 0.045] }
    - { shape: hexagon, position: -0.2, offset: [-0.18, -0.18], size: 0.1, rotation: 0.7236, color: [0.0004, 0.0033, 0.0049] }
    - { shape: hexagon, position: -3.036, offset: [-0.18, -0.18], size: 0.1, rotation: 0.7236, color: [0.0066, 0.0097, 0.0089] }
    - { shape: hexagon, position: -0.539, offset: [-0.18, -0.18], size: 0.1, rotation: 0.7236, color: [0.0075, 0.0006, 0.0001] }
    - { shape: hexagon, position: -0.768, offset: [-0.18, -0.18], size: 0.1, rotation: 0.7236, color: [0.0001, 0.0061, 0.0076] }
    - { shape: hexagon, position: -0.534, offset: [-0.18, -0.18], size: 0.1, rotation: 0.7236, color: [0.0089, 0.008, 0.0066] }
    - { shape: streak, position: 1, size: 0.001, power: 16, color: [0.0375, 0.0375, 0.0375], tinted: true }
# Small streaks of dust around the camera that show the player's speed. A mod
# can change these values.
speed_effect:
  enabled: false
  # The streaks' brightness at full speed, 0 to 1.
  brightness: 0.2
  # The number of streaks in the 165 m box around the camera, 0 to 1024.
  particles: 256
texture_filtering:
  anisotropic: true
  max_anisotropy: 8.0
hangar_lighting:
  # Artificial ceiling source for the enclosed hangar. The launch-reference
  # backdrop receives shadows but does not cast into this light. It replaces
  # the classic hangar light, but not the classic red alert lights.
  enabled: true
  direction_x: 0.0
  direction_y: 0.0
  direction_z: 1.0
  intensity: 100.0  # illuminance in W/m^2 (34,150 lux), up to 2000
  color_r: 1.0
  color_g: 1.0
  color_b: 1.0
  # Ambient cube in W/m^2/sr, up to 1000: +Z ceiling fill, horizontal wall
  # bounce, -Z floor bounce. It takes the key light's hue.
  ambient_ceiling: 3.0
  ambient_sides: 3.0
  ambient_floor: 3.0
# Authored per-region HDR environments (sky, diffuse and specular lighting,
# suns). The manifest path is relative to the mod folder. It holds the
# `environments:` map and, under `xwa:`, the (mission, region) mapping and
# the default environment. Without a manifest, no region has an environment.
# Regions without an entry use the default environment, or the classic HD
# sky when there is none.
environment_maps:
  enabled: true
  manifest: "flight/environments/environments.yaml"
  # Multiplies the intensity of every environment: the sky and overlay
  # that are drawn, and the diffuse light and reflections they give the
  # models. The suns and the ambient fill stay the same. 0 to 10.
  intensity_scale: 1.0
  # Largest radiance a sun disc is drawn with (its lighting is not capped).
  # A physical disc is far brighter than screen-space bloom resolves
  # cleanly; 1 to 60000.
  sun_max_radiance: 100.0
  # Captured lighting builds lighting cubes in game from the region's sky
  # and its backdrops other than suns. It applies to regions without an
  # environment and to skies with `backdrops: keep`.
  captured_lighting:
    enabled: true
    size: 512             # face size of the cubes: 64, 128, 256 or 512
    specular_samples: 64  # samples per texel of the blurred reflections: 1 to 1024
    # In regions without an environment:
    diffuse_strength: 1.0
    specular_strength: 1.0
    # ambient_fill: [0.02, 0.02, 0.02]   # replaces the game's ambient when set
# The twinkling starfield drawn in regions without an environment sky. It
# reproduces the classic FlightStarfield_Render on the GPU.
starfield:
  exposure: 1.0
  brightness: 1.0   # peak star brightness, at the classic radiance
  density: 0.4      # grid-cell occupancy; star count ~= 6*grid^2*density
  grid: 32          # cells per cube-face edge (angular spacing)
  # Dot geometry in classic viewport pixels, scaled by the viewport->render
  # upscale at draw time so a star matches the classic single-pixel look at
  # any resolution.
  core_px: 0.5      # star dot half-extent (classic px); 0.5 = 1 pixel
  feather: 0.25     # dot antialias edge (classic px)
  flare: 1.0        # bright-star flare brightness (0 = off); exact
                    # DrawBrightStarFlare +-1px plus/L pattern
hyperspace_tunnel:
  # Ship-relative 3D simplex tunnel used by the remaster renderer.
  travel_speed: 13.0      # forward rate; 8 matches the reference shader
  rotation_speed: -2.3   # radians per second around the tunnel axis
  noise_scale: 0.5       # multiplier for all simplex octave frequencies
  brightness: 0.6        # tunnel brightness, at the classic radiance
  highlight_strength: 3.0 # cyan-white noise highlights and cap light; independent of the blue body
  focal_length: 0.9     # tunnel perspective; larger values narrow the apparent opening
  twist: 0.1       # reference angular shear: 1.25 / (2 * pi)
  cap_radius: 0.001       # normalized-screen radius of the full-strength white core
  cap_falloff: 30.0        # exponential falloff outside the core
  mesh_ambient_strength: 0.7  # tunnel radiance contribution to HD cockpit diffuse lighting
  mesh_environment_roughness: 1.0 # 0 = sharp field, 1 = cosine-hemisphere diffuse convolution
  mesh_key_strength: 0.377     # cap-colored HD cockpit directional/specular lighting, a factor of the tunnel radiance
  dark_color_r: 0.0      # reference tunnel reaches black between noise structures
  dark_color_g: 0.0
  dark_color_b: 0.0
  body_color_r: 0.0
  body_color_g: 0.0
  body_color_b: 1
  highlight_color_r: 0.05
  highlight_color_g: 0.24
  highlight_color_b: 0.99
  cap_color_r: 0.09       # linear HDR color of the distant additive light
  cap_color_g: 0.28
  cap_color_b: 1.0
hyperspace_jump:
  # Star streaks of the hyperspace entry and exit (docs/hd_hyperspace_jump.md).
  star_count: 65536           # stars over the whole sphere; about a tenth are on screen
  streak_brightness: 0.4      # brightness of the stars at the start, at the classic radiance
  whiteout_brightness: 24.0   # brightness factor at the peak of the white-out
  brightness_range: 100      # ratio between the brightest and faintest stars
  streak_width_px: 0.9        # streak width at 1080p
  width_from_brightness: 0.0 # 0 = same width for all stars, 1 = width follows brightness
  width_variation: 1.3        # random width factor per star, from 1/x to x
  head_widening: 1.15          # largest width factor from perspective and radial widening together
  radial_widening: 0.3        # extra width per screen half-height from the vanishing point
  tail_taper: 0.35            # tail fade, as a share of the streak's 3D length
  head_taper: 0.15             # head fade, as a share of the streak's 3D length
  taper_variation: 0.5        # random spread of the fades per star, 0 to 1
  glow_strength: 0.25         # brightness of the soft skirt around the core, 0 to 1
  glow_width: 4.0             # width of the skirt, in core widths
  tail_brightness: 0.35       # brightness at the tail, as a share of the head's
  tail_color_r: 0.11          # colour at the tail; the head keeps the star's colour
  tail_color_g: 0.24
  tail_color_b: 1.00
  stretch_scale: 0.8          # multiplies how far the stars travel
  white_fade_seconds: 0.15    # fade between the white streak field and the tunnel
  tunnel_entry_brightness: 2.0 # tunnel brightness factor at the fade
  tunnel_settle_seconds: 0.15  # time for the tunnel to settle to its normal brightness
  mesh_light_strength: 0.5    # streak light on the cockpit at the white peak, in white classic pixels
  mesh_light_start: 0.1       # seconds into the entry when the cockpit light starts rising
  mesh_light_curve: 2.0       # exponent of the rise: 1 = straight, higher = later and steeper
  tint_r: 0.122                # colour the streaks move toward during the jump
  tint_g: 0.3544
  tint_b: 1.00
  exit_forward: true         # true: on exit the streaks shrink toward the camera and the scene comes in toward it
  # Scene warp: the scene zooms toward the camera and black opens from the
  # vanishing point. The exit plays it backward, or forward with exit_forward.
  warp_start: 0.0             # seconds into the entry when the scene starts moving
  warp_end: 2.0               # seconds into the entry when only black remains
  warp_curve: 3.0             # exponent of the progress: higher starts slower and ends faster
  warp_distance_m: 10000.0    # how far the world moves toward the camera by warp_end, in metres
  warp_sky_zoom: 8.0          # sky magnification at the vanishing point by warp_end; 1 = still
  warp_smear: 1.0             # smear length, as a share of the movement (0.05 to 1)
  warp_sky_highlights: 2.0    # how much bright sky samples count in the smear; 1 = plain average
  warp_reveal_softness: 1.0   # width of the black's soft edge, as a share of the distance to the farthest corner
  warp_taps: 24               # samples per pixel along the world's walk
  warp_sky_taps: 8            # samples per pixel in each of the three sky passes
  warp_sky_half_resolution: true # the sky passes run at half the output resolution
# The camera in the player's hyperspace jumps, in modern graphics. A look
# (hyperspace_looks) has its own camera group with the same keys. The look's
# shake gradually replaces this one between its shake_start and shake_full,
# and its jolt replaces this one. The Camera Shake option turns both off.
# Fractions of the tunnel go from 0, when the tunnel appears, to 1, when it
# ends.
hyperspace_camera:
  # The camera and the cockpit shake together, as if the pilot is rattled.
  shake_degrees: 0.05   # how far it shakes at full strength, in degrees, 0 to 10
  shake_speed: 0.3      # how fast it shakes, 0 to 4 (1 is the normal speed)
  shake_start: 0.0      # when the shake starts, as a fraction of the tunnel
  shake_full: 0.01      # when it reaches full strength
  kick_rate: 0.0        # kicks per second, 0 to 8
  # The camera jolts when the craft comes out of hyperspace, and settles
  # before the exit ends.
  jolt_degrees: 0.3     # how far the camera turns at the jolt's peak, in degrees, 0 to 20
  jolt_delay: 0.15      # how long after the exit starts it hits, in seconds, 0 to 0.5
  jolt_time: 0.2        # how fast it settles, in seconds, 0.05 to 0.8
hyperspace_looks:
  # Other looks for the player's hyperspace jump. A mission picks one for
  # jumps to a given region (hyperspace_regions in its settings). A look only
  # changes the tunnel, the exit and the camera. The start of the jump looks
  # normal.
  interdiction:
    # A jump that a gravity well cuts short. Red spreads through the tunnel
    # from its far end toward the camera. The camera shakes more and more,
    # and jolts when the craft is pulled out. The streaks are red when the
    # player comes out of hyperspace.
    tunnel:
      # The tunnel's colours where the red has reached it. They replace the
      # colours of hyperspace_tunnel.
      dark_color_r: 0.0
      dark_color_g: 0.0
      dark_color_b: 0.0
      body_color_r: 0.38
      body_color_g: 0.01
      body_color_b: 0.01
      highlight_color_r: 0.45
      highlight_color_g: 0.38
      highlight_color_b: 0.02
      cap_color_r: 1.0
      cap_color_g: 0.12
      cap_color_b: 0.04
      # The edge of the red area, a thin glowing line.
      edge_color_r: 1.0
      edge_color_g: 0.45
      edge_color_b: 0.06
      edge_width: 0.12       # how thick the edge is
      front_noise: 0.5       # how uneven the edge is: how far its bumps reach ahead
      front_noise_scale: 0.7 # how many bumps there are: higher gives more, smaller bumps
      front_warp: 0.3        # how much the bumps twist into curls
    jump:
      # The colours of the streaks when the player comes out of hyperspace.
      tint_r: 0.79
      tint_g: 0.02
      tint_b: 0.02
      tail_color_r: 0.79
      tail_color_g: 0.02
      tail_color_b: 0.02
    # When the red starts to spread and when it fills the tunnel, as fractions
    # of the time in the tunnel: 0 is when the tunnel appears, 1 when it ends.
    blend_start: 0.2
    blend_end: 0.55
    camera:
      # The same keys as hyperspace_camera. Between shake_start and
      # shake_full, this shake gradually replaces the normal one, and it grows
      # until the gravity well pulls the craft out. Then the camera jolts
      # hard.
      shake_degrees: 0.7
      shake_speed: 0.7
      shake_start: 0.18
      shake_full: 1.0
      kick_rate: 1.5
      jolt_degrees: 4.0
      jolt_delay: 0.1
      jolt_time: 0.3
point_lights:
  enabled: true
  cluster_depth_slices: 24
  cluster_debug: false       # occupancy view; debug-UI builds only
  # The game's lights (lasers, explosions, engines) are physical
  # inverse-square sphere lights from the classic intensities. This many
  # metres away they give what the classic law gives, converted by
  # classic_lighting, so brighter closer and dimmer farther.
  match_distance_m: 27.5
  # Multiplies the distance where a light falls under 1/250 of a unit of
  # illuminance after the exposure, and ends.
  range_scale: 1.0
  # A hit on the player's craft puts an explosion on the hull, a metre or
  # two from the eye, and its light washes out the cockpit. While the
  # cockpit is shown, the light of an explosion up to
  # cockpit_explosion_distance_m from the eye is multiplied by
  # cockpit_explosion_light_scale (0 to 1). From there to twice that
  # distance, the scale goes back up to 1. A distance of 0 turns this off.
  cockpit_explosion_light_scale: 0.02
  cockpit_explosion_distance_m: 10.0
  # Turns on the lights that are set in candela: the lights in models (such
  # as the interior light of the converted cockpits), the headlight, and the
  # cockpit lights and particle lights below. When this is off, the game's
  # own cockpit lights and particle lights are used instead.
  model_lights: true
  # The lights that the game blinks in the cockpit, such as the red light
  # when the hull is low. Each one works like a Blender point light:
  #   power_w: the power in watts. 0 turns the light off.
  #   position_m: where the light is, in metres from the pilot's eye
  #     (X right, Y up, Z forward). The default is the eye.
  #   color: the colour, as linear values. The default is the game's colour.
  # A mod can change these lights in the cockpit_lights section of its
  # flight/flight.yaml. Each key that the mod sets replaces the one here.
  # The game's own lights aren't used, because the match_distance_m
  # conversion makes them far too bright this close to the cockpit.
  cockpit_lights:
    hull_critical:
      power_w: 400
    warhead_lock:
      power_w: 400
    beam_warning:
      power_w: 400
  # The lights of the particle effects on craft. cockpit_sparks and
  # cockpit_smoke are the sparks and smoke in the cockpit when a hit gets
  # through the shields. player_craft_damage is every other effect on the
  # player's craft, and craft_damage is every other effect on the other
  # objects. power_w and color work as above. fade: true dims the light
  # over the effect's life. A mod can change them in the particle_lights
  # section of its flight/flight.yaml. 158,000 W matches the game's light
  # with the default match_distance_m and classic_lighting.illuminance.
  # On the player's craft, the light is about a metre from the eye in the
  # cockpit, so that power would wash out the screen.
  particle_lights:
    cockpit_sparks:
      power_w: 30
    cockpit_smoke:
      power_w: 0
    craft_damage:
      power_w: 158000
    player_craft_damage:
      power_w: 400
  # The headlights of the player's craft. They are a Blender area light of
  # power_w watts (0 turns them off), at position_m from the pilot's eye
  # (X right, Y up, Z forward), pointing along the nose. color is linear.
  # angle_degrees, up to 90, is where the cone ends. With 0, there is no
  # cone, and the light fades towards the sides. The headlights section of
  # a mod's flight/flight.yaml can change these values, and when the
  # headlights turn on. Each key that the mod sets replaces the one here.
  headlights:
    position_m: [0, 0, 20]
    color: [0.944, 0.944, 1]
    power_w: 4000000
    angle_degrees: 40
classic_lighting:
  # Converts the classic game's lights (suns and other backdrops, the game's
  # lights in the hangar, lasers, explosions, engines), which have no unit.
  # This is the illuminance in W/m^2 of a classic light of brightness 1.
  # 186 makes the white sun the real sun at the Earth's distance
  # (127,000 lux). Above 0, up to 2000.
  illuminance: 300.0
  # The radiance in W/m^2/sr of a white pixel of the classic images
  # (backdrops, lit texels, projectiles, glow marks, cockpit screens,
  # stars). 59.2 makes it as bright as a white surface that faces a light
  # of 186 W/m^2. Raise illuminance alone to make the lit models brighter
  # than the images. Above 0, up to 1000.
  image_radiance: 59.2056
lighting:
  spec_geom_adapt: true
  # Ambient fill in W/m^2/sr, where no environment gives one. 5.9 gives a
  # surface 10% of the white sun's light.
  ambient_r: 3.0
  ambient_g: 3.0
  ambient_b: 3.0
  # The least ambient light on the in-flight map, so that the craft can be
  # seen in dim regions.
  map_ambient_min_r: 5.0
  map_ambient_min_g: 5.0
  map_ambient_min_b: 5.0
  # The ambient fill inside the Death Star, in W/m^2/sr, when the region has
  # no environment. It replaces the light of the mission's backdrop, which
  # would light the tunnel like a sun, through the walls.
  death_star_ambient_r: 3.0
  death_star_ambient_g: 3.0
  death_star_ambient_b: 3.0
  # Scale of all emitted light (illumination, screens, holograms, lasers,
  # glows, explosions). Emitters far brighter than lit surfaces are what
  # visibly glow through bloom.
  emissive_scale: 1.0
exposure:
  # Camera exposure in EV100: the image shows the scene (W/m^2 at 683 lm/W)
  # as a camera at ISO 100 would. A higher value makes the image darker.
  # A sunlit scene is about 15. EVs are -6 to 24.
  # fixed: the image is exposed at ev100 - compensation.
  # metered: the exposure is metered from the image each frame, and adapts.
  mode: "metered"
  ev100: 15.0          # fixed mode, and the anchor of partial metering
  compensation: 0.0    # EV added to brightness, -10 to 10
  # 0 = ev100, 1 = full metering. Partial keeps part of the difference
  # between scenes: a dim region still looks dimmer.
  metering: 0.6
  min_ev100: 13.5
  max_ev100: 16.0
  # Adaptation rate per second, in each direction. The gap in EV shrinks as
  # e^(-speed * t): at 1.5, 78% of it is closed after one second.
  brighten_speed: 1.5  # when the scene gets darker
  darken_speed: 1.5    # when the scene gets brighter
  # The meter averages the EV of the weighted pixels between two
  # percentiles. The high one leaves out the sun disc and laser bolts.
  low_percent: 10.0
  high_percent: 90.0
  # Weight of pixels with no geometry (sky, backdrops, effects over empty
  # space), so that black space doesn't decide the exposure of a ship.
  sky_weight: 0.02
  # Weight of geometry nearer than near_distance metres: the cockpit, so
  # that its dark interior doesn't decide the exposure of the view outside.
  near_weight: 0.05
  near_distance: 5.0
  edge_weight: 0.25    # weight at the screen's corners; 1 at the centre
  channel: "max" # luminance, or max: the largest of r, g and b
bloom:
  # Fraction of the scene's light the bloom scatters (no threshold), 0 to 1.
  # The scattered light leaves its source, so lit surfaces do not brighten.
  intensity: 0.15
temporal_upscaling:
  # off, native_aa, quality, balanced, or performance.
  mode: "off"
  # Positive values enable FSR's RCAS pass.
  sharpness: 0.0
motion_blur:
  quality: 2
  shutter: 0.5
  camera_blur: true
  pause_keep_blur: true
  velocity_viz: false
small_objects:
  # Objects smaller than these on screen are left out, by the larger side of
  # their bounds, in pixels of a 1080-line view (scaled to the render
  # height); 0 is off. Only with MSAA on and temporal upscaling off.
  # Smaller ones aren't drawn in the depth prepass and cast no shadow.
  prepass_min_size: 2.5
  # Smaller ones aren't drawn at all, except laser bolts.
  draw_min_size: 0.6
shadows:
  receiver_local_near_distance_m: 1.5