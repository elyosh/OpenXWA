name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.build-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build package
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/linux/Dockerfile
          platforms: linux/amd64
          target: artifact
          build-args: |
            XWA_BUILD_TYPE=${{ matrix.build-type }}
            XWA_VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=build/artifacts
          cache-from: type=gha,scope=linux

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxwa-linux-x86_64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.tar.xz
          if-no-files-found: error

      # The Blender add-on's cooker, from the same dependency stages.
      - name: Build add-on cooker
        if: matrix.build-type == 'Release'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/linux/Dockerfile
          platforms: linux/amd64
          target: cooker-artifact
          outputs: type=local,dest=build/cooker
          cache-from: type=gha,scope=linux

      - name: Upload add-on cooker
        if: matrix.build-type == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: aeron-gltf-cook-linux-x64
          path: build/cooker/
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.build-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build package
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/windows/Dockerfile
          platforms: linux/amd64
          target: artifact
          build-args: |
            XWA_BUILD_TYPE=${{ matrix.build-type }}
            XWA_VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=build/artifacts
          cache-from: type=gha,scope=windows

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxwa-windows-x86_64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.zip
          if-no-files-found: error

      # The Blender add-on's cooker, from the same dependency stages.
      - name: Build add-on cooker
        if: matrix.build-type == 'Release'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/windows/Dockerfile
          platforms: linux/amd64
          target: cooker-artifact
          outputs: type=local,dest=build/cooker
          cache-from: type=gha,scope=windows

      - name: Upload add-on cooker
        if: matrix.build-type == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: aeron-gltf-cook-windows-x64
          path: build/cooker/
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.build-type }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install cmake ninja pkg-config

      - name: Determine runner image version
        id: runner-image
        run: echo "version=${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency caches
        uses: actions/cache@v6
        with:
          path: |
            build/cache/macos-arm64/sources
            build/cache/macos-arm64/dependencies
            build/cache/macos-arm64/tools
            build/cache/macos-arm64/build/sdl
            build/cache/macos-arm64/build/zstd
            build/cache/macos-arm64/build/ffmpeg
            build/cache/macos-arm64/build/shadercross
            build/cache/macos-arm64/cooker-dependencies
            build/cache/macos-arm64/build/cooker-sdl
            build/cache/macos-arm64/build/cooker-zstd
          key: macos-arm64-${{ steps.runner-image.outputs.version }}-deps-${{ hashFiles('packaging/macos/build-package.sh', 'packaging/common/shadercross-fsr3.patch') }}

      - name: Build package
        env:
          XWA_BUILD_TYPE: ${{ matrix.build-type }}
          XWA_MACOS_BUILD_VERSION: ${{ github.run_number }}
          XWA_MACOS_BUILD_COOKER: ${{ matrix.build-type == 'Release' && '1' || '0' }}
        run: |
          XWA_VERSION="${GITHUB_REF_NAME#v}" ./packaging/macos/build-package.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxwa-macos-arm64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.dmg
          if-no-files-found: error

      - name: Upload add-on cooker
        if: matrix.build-type == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: aeron-gltf-cook-macos
          path: build/artifacts/aeron_gltf_cook-macos/
          if-no-files-found: error

  addon:
    name: Blender add-on packages
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download cookers
        uses: actions/download-artifact@v8
        with:
          pattern: aeron-gltf-cook-*
          path: cookers

      # One package per platform, each with its cooker and zstd's license.
      - name: Build packages
        run: |
          for platform in linux-x64 windows-x64 macos; do
            dir="cookers/aeron-gltf-cook-${platform}"
            cooker="${dir}/aeron_gltf_cook"
            [ "${platform}" != windows-x64 ] || cooker="${cooker}.exe"
            python3 aeron/tools/gltf_cook/package_addon.py --platform "${platform}" \
                --cooker "${cooker}" --license "zstd=${dir}/zstd.txt" --out build/addon
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: aeron-flight-model-addon
          path: build/addon/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows, macos, addon]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: openxwa-*
          path: artifacts
          merge-multiple: true

      - name: Download add-on packages
        uses: actions/download-artifact@v8
        with:
          name: aeron-flight-model-addon
          path: artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "OpenXWA ${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --generate-notes \
              artifacts/*
