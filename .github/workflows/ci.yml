name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux ${{ matrix.build-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ github.event_name == 'push' && fromJSON('["Release", "Debug"]') || fromJSON('["Release"]') }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build package
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/linux/Dockerfile
          platforms: linux/amd64
          target: artifact
          build-args: |
            XWA_BUILD_TYPE=${{ matrix.build-type }}
            XWA_VERSION=${{ steps.sha.outputs.short }}
          outputs: type=local,dest=build/artifacts
          cache-from: type=gha,scope=linux
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=linux' || '' }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxwa-linux-x86_64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.tar.xz
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.build-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ github.event_name == 'push' && fromJSON('["Release", "Debug"]') || fromJSON('["Release"]') }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build package
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/windows/Dockerfile
          platforms: linux/amd64
          target: artifact
          build-args: |
            XWA_BUILD_TYPE=${{ matrix.build-type }}
            XWA_VERSION=${{ steps.sha.outputs.short }}
          outputs: type=local,dest=build/artifacts
          cache-from: type=gha,scope=windows
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=windows' || '' }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxwa-windows-x86_64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.build-type }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ github.event_name == 'push' && fromJSON('["Release", "Debug"]') || fromJSON('["Release"]') }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: brew install cmake ninja pkg-config ispc

      - name: Determine runner image version
        id: runner-image
        run: echo "version=${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency caches
        uses: actions/cache@v6
        with:
          path: |
            build/cache/macos-arm64/sources
            build/cache/macos-arm64/dependencies
            build/cache/macos-arm64/tools
            build/cache/macos-arm64/build/sdl
            build/cache/macos-arm64/build/zstd
            build/cache/macos-arm64/build/ffmpeg
            build/cache/macos-arm64/build/shadercross
          key: macos-arm64-${{ steps.runner-image.outputs.version }}-deps-${{ hashFiles('packaging/macos/build-package.sh', 'aeron/packaging/dependencies/**') }}

      - name: Determine ISPC version
        id: ispc
        run: echo "version=$(ispc --version | sed -n 's/.*ISPC), \([0-9.]*\).*/\1/p')" >> "$GITHUB_OUTPUT"

      # The compiled ISPC kernel, which takes minutes to compile.
      - name: Restore ISPC kernel cache
        uses: actions/cache@v6
        with:
          path: build/cache/macos-arm64/ispc-kernel
          key: macos-arm64-ispc-kernel-${{ steps.ispc.outputs.version }}-${{ hashFiles('aeron/third_party/ispc_texcomp/kernel.ispc', 'aeron/tools/imgbake/ispc_kernel.cmake') }}

      - name: Build package
        env:
          XWA_BUILD_TYPE: ${{ matrix.build-type }}
          XWA_VERSION: ${{ steps.sha.outputs.short }}
        run: ./packaging/macos/build-package.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxwa-macos-arm64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.dmg
          if-no-files-found: error

  # Puts this build's packages on the "development" prerelease. The release is
  # created once and then edited, so people who watch releases are notified
  # only once. The new files are uploaded before the old ones are deleted, so
  # there is always a complete build to download. CI runs on main don't overlap
  # (see concurrency above), so an older build can't replace a newer one.
  publish-development:
    name: Publish development build
    if: github.event_name == 'push'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: openxwa-*
          path: packages
          merge-multiple: true

      - name: Update development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=development
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          stable="$(gh release view --json tagName -q .tagName)"

          # The tag still points to the previous build until the end of this step.
          changes=""
          if previous="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" -q .object.sha 2>/dev/null)" &&
              [[ "${previous}" != "${GITHUB_SHA}" ]]; then
            compare="$(gh api "repos/${GH_REPO}/compare/${previous}...${GITHUB_SHA}?per_page=100")"
            total="$(jq .total_commits <<<"${compare}")"
            if (( total <= 100 )); then
              changes="Changes since the previous build:"$'\n\n'"$(jq -r '.commits | reverse | .[] |
                  "- \(.commit.message | split("\n")[0]) ([\(.sha[:7])](\(.html_url)))"' <<<"${compare}")"
            else
              changes="[${total} changes since the previous build](${url}/compare/${previous}...${GITHUB_SHA})"
            fi
          fi

          notes="$(cat <<NOTES
          Built on $(date -u '+%Y-%m-%d at %H:%M UTC') from commit [${GITHUB_SHA::7}](${url}/commit/${GITHUB_SHA}).
          This build has features that aren't released yet and may have new bugs. A new build replaces it after every change. The latest stable version is [${stable}](${url}/releases/tag/${stable}).

          ${changes}

          [All changes since ${stable}](${url}/compare/${stable}...${GITHUB_SHA})

          Download the \`-release\` file for your platform. The \`-debug\` and \`-symbols\` files are for diagnosing problems.

          **macOS:** this build isn't signed by Apple, so macOS blocks it the first time you open it. To allow it, click **Open Anyway** in **System Settings** > **Privacy & Security**. Do this for both OpenXWA and the OpenXWA Mod Importer.
          NOTES
          )"

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --target "${GITHUB_SHA}" --prerelease --latest=false \
                --title "OpenXWA development build" --notes "${notes}"
          fi

          old="$(gh release view "${tag}" --json assets -q '.assets[].name')"
          gh release upload "${tag}" packages/* --clobber
          for name in ${old}; do
            if [[ ! -e "packages/${name}" ]]; then
              gh release delete-asset "${tag}" "${name}" --yes
            fi
          done

          # Move the tag and update the notes last, so they never describe files that aren't uploaded yet.
          gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${tag}" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          gh release edit "${tag}" --notes "${notes}"
